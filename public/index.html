    <script>
      // Applies the last-known theme before React mounts, so an
      // authenticated visitor who prefers dark doesn't see a flash of the
      // light page first. Reconciled against the server profile (which
      // wins on conflict) once auth resolves -- see src/app/PreferencesSync.jsx.
      (function () {
        try {
          if (window.localStorage.getItem('tripsplit:theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable -- default light applies */ }
      })();
    </script>
